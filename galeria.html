<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Galeria | Turma 136</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ==================== CABEÇALHO ==================== -->
    <header class="header">
        <a href="index.html" class="logo">136</a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="quem-somos.html">Quem Somos</a>
            <a href="projetos.html">Projetos</a>
            <a href="curso.html">Curso</a>
            <a href="galeria.html" class="ativo">Galeria</a>
        </nav>
    </header>

    <!-- ==================== BLOCO: GALERIA DE FOTOS ==================== -->
    <section class="galeria" id="galeria">
        <h2 class="titulo-secao">GALERIA DE FOTOS</h2>

        <div class="carrossel-galeria">
            <button class="seta seta-anterior" aria-label="Anterior">&lt;</button>

            <div class="galeria-viewport">
                <div class="galeria-track">
                    <div class="card-imagem"><img src="assents/galeria/Ruthkkkj.png" alt="Turma reunida"></div>
                    <div class="card-imagem"><img src="assents/galeria/Elias_Richard.png" alt="Entrega de certificados">
                    </div>
                    <div class="card-imagem"><img src="assents/galeria/NN.png" alt="Coffee break"></div>
                    <!-- Adicione/remova imagens aqui — o JS se adapta sozinho -->
                    <div class="card-imagem"><img src="assents/galeria/Elevador.png" alt="Aula"></div>
                    <div class="card-imagem"><img src="assents/galeria/AdryDeNovo.png" alt="PSP"></div>
                    <div class="card-imagem"><img src="assents/galeria/Joana.png" alt="Adry"></div>
                </div>
            </div>

            <button class="seta seta-proxima" aria-label="Próximo">&gt;</button>
        </div>

        <!-- Os dots são criados automaticamente pelo JS -->
        <div class="dots"></div>
    </section>

    <!-- ==================== BLOCO: GALERIA DE FOTOS 2 ==================== -->


    <section class="galeria" id="galeria-2">
    
        <div class="carrossel-galeria">
            <button class="seta seta-anterior" aria-label="Anterior">&lt;</button>

            <div class="galeria-viewport">
                <div class="galeria-track">
                    <div class="card-imagem"><img src="assents/galeria/Turma.png" alt="Turma reunida"></div>
                    <div class="card-imagem"><img src="assents/galeria/Certificado.png" alt="Entrega de certificados">
                    </div>
                    <div class="card-imagem"><img src="assents/galeria/CoffeBreak.png" alt="Coffee break"></div>
                    <!-- Adicione/remova imagens aqui — o JS se adapta sozinho -->
                    <div class="card-imagem"><img src="assents/galeria/AnaKkkkk.png" alt="Aula"></div>
                    <div class="card-imagem"><img src="assents/galeria/PSP.png" alt="PSP"></div>
                    <div class="card-imagem"><img src="assents/galeria/Adry.png" alt="Adry"></div>
                </div>
            </div>

            <button class="seta seta-proxima" aria-label="Próximo">&gt;</button>
        </div>

        <!-- Os dots são criados automaticamente pelo JS -->
        <div class="dots"></div>
    </section>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <p><strong>TURMA 136</strong> — © 2026 Todos os direitos reservados</p>
    </footer>

    <script>
        // ==================== CARROSSEL DA GALERIA ====================
        document.querySelectorAll('.galeria').forEach((secaoGaleria) => {
            const track = secaoGaleria.querySelector('.galeria-track');
            if (!track) return;

            const cards = Array.from(track.children);
            const btnAnterior = secaoGaleria.querySelector('.seta-anterior');
            const btnProxima = secaoGaleria.querySelector('.seta-proxima');
            const dotsWrap = secaoGaleria.querySelector('.dots');

            let indice = 0;

            // Quantas imagens aparecem por vez (acompanha o CSS responsivo)
            const visiveis = () => {
                if (window.innerWidth <= 560) return 1;
                if (window.innerWidth <= 900) return 2;
                return 3;
            };

            const maxIndice = () => Math.max(0, cards.length - visiveis());

            // Desliza o trilho até o índice atual e atualiza o dot ativo
            function mover() {
                const gap = parseFloat(getComputedStyle(track).gap) || 0;
                const passo = cards[0] ? (cards[0].getBoundingClientRect().width + gap) : 0;
                track.style.transform = `translateX(${-indice * passo}px)`;

                if (dotsWrap) {
                    dotsWrap.querySelectorAll('.dot').forEach((d, i) =>
                        d.classList.toggle('ativo', i === indice)
                    );
                }
            }

            // Cria um dot para cada "página" do carrossel
            function criarDots() {
                if (!dotsWrap) return;
                dotsWrap.innerHTML = '';
                for (let i = 0; i <= maxIndice(); i++) {
                    const dot = document.createElement('span');
                    dot.className = 'dot';
                    dot.setAttribute('aria-label', `Ir para a página ${i + 1}`);
                    dot.addEventListener('click', () => { indice = i; mover(); });
                    dotsWrap.appendChild(dot);
                }
            }

            if (btnProxima) {
                btnProxima.addEventListener('click', () => {
                    indice = indice >= maxIndice() ? 0 : indice + 1; // volta ao início no fim
                    mover();
                });
            }

            if (btnAnterior) {
                btnAnterior.addEventListener('click', () => {
                    indice = indice <= 0 ? maxIndice() : indice - 1; // vai ao fim no início
                    mover();
                });
            }

            // Recalcula ao redimensionar a janela
            window.addEventListener('resize', () => {
                indice = Math.min(indice, maxIndice());
                criarDots();
                mover();
            });

            criarDots();
            mover();
        });
    </script>

</body>

</html>
